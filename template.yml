    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: recoveryCron.handler
      Runtime: nodejs22.x
      Timeout: 900
      MemorySize: 512
      Architectures:
      - x86_64
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserRequestTable
      - S3CrudPolicy:
          BucketName:
            Ref: S3ResourceBucketName
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          - ssm:GetParametersByPath
          Resource:
          - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ConfigSsmPath}
          - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ConfigSsmPath}/*
        - Effect: Allow
          Action:
          - states:RedriveExecution
          - states:DescribeExecution
          Resource:
          - Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:BikinAi-VideoGeneration${EnvironmentSuffix}:*
          - Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:MotionGraphicsStateMachine-${EnvironmentSuffix}:*
      Environment:
        Variables:
          USER_REQUEST_TABLE_NAME:
            Ref: UserRequestTable
          S3_RESOURCE_BUCKET:
            Ref: S3ResourceBucketName
          IMAGE_PROMPT_ID_INDEX: ImagePromptIdIndex
          VIDEO_PROMPT_ID_INDEX: ComfyPromptIdIndex
          CONFIG_SSM_PATH:
            Ref: ConfigSsmPath
          UPSTASH_REDIS_REST_URL:
            Ref: UpstashRedisRestUrl
          UPSTASH_REDIS_REST_TOKEN:
            Ref: UpstashRedisRestToken
      Events:
        TwoMinuteCronEvent:
          Type: Schedule
          Properties:
            Schedule: rate(2 minutes)
            Description: Recover stalled jobs and retry concurrency failures
            Enabled: true

